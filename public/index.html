<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>JOHNNY AI</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #2b2b2f;
    --text: var(--tg-theme-text-color, #f2f2f2);
    --hint: var(--tg-theme-hint-color, #a0a0a5);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --secondary-bg: #3a3a3f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app {
    display: flex; flex-direction: column; height: 100vh;
  }
  #header {
    padding: 14px 16px; font-weight: 600; font-size: 17px;
    border-bottom: 1px solid var(--secondary-bg);
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 80%; padding: 10px 14px; border-radius: 16px;
    line-height: 1.4; font-size: 15px; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end; background: var(--button); color: var(--button-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start; background: var(--secondary-bg); color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.typing { opacity: 0.6; font-style: italic; }
  #inputBar {
    display: flex; gap: 8px; padding: 10px 12px;
    border-top: 1px solid var(--secondary-bg); background: var(--bg);
  }
  #textInput {
    flex: 1; border: 1px solid var(--secondary-bg); border-radius: 20px;
    padding: 10px 16px; font-size: 15px; background: var(--secondary-bg); color: var(--text);
    outline: none; resize: none;
  }
  #sendBtn {
    background: var(--button); color: var(--button-text); border: none;
    border-radius: 20px; padding: 0 18px; font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; }
  .empty-state {
    text-align: center; color: var(--hint); margin-top: 40px; font-size: 14px; padding: 0 20px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">🤖 JOHNNY AI</div>
  <div id="messages">
    <div class="empty-state" id="emptyState">Задай любой вопрос — нейросеть ответит прямо здесь.</div>
  </div>
  <div id="inputBar">
    <textarea id="textInput" rows="1" placeholder="Напишите вопрос..."></textarea>
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // ВАЖНО: если фронтенд и бэкенд на одном домене — оставьте пустую строку.
  // Если разместили отдельно, впишите сюда адрес бэкенда, например:
  // const API_URL = 'https://мой-сервер.onrender.com';
  const API_URL = '';

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const emptyState = document.getElementById('emptyState');

  let history = []; // [{role: 'user'|'assistant', content: '...'}]

  function addMessage(role, text) {
    emptyState.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const typingEl = addMessage('bot', 'печатает...');
    typingEl.classList.add('typing');

    try {
      const res = await fetch(API_URL + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();

      typingEl.remove();

      if (!res.ok) {
        addMessage('bot', 'Ошибка: ' + (data.error || 'что-то пошло не так'));
      } else {
        addMessage('bot', data.reply);
        history.push({ role: 'assistant', content: data.reply });
      }
    } catch (err) {
      typingEl.remove();
      addMessage('bot', 'Не удалось связаться с сервером. Проверьте подключение.');
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
